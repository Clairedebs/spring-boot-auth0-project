# Server Configuration
spring.application.name=spring-boot-auth0-project
server.port=8080

# Auth0 Configuration
auth0.domain=${AUTH0_DOMAIN:your-domain.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:your-api-audience}
auth0.connection=${AUTH0_CONNECTION:Username-Password-Authentication}

# Auth0 Management API Configuration
auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID:your-management-client-id}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET:your-management-client-secret}

# Logging
logging.level.com.example.auth0app=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
