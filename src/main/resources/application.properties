# Server Configuration
spring.application.name=spring-boot-auth0-project
server.port=8080

# Auth0 Configuration
auth0.domain=${AUTH0_DOMAIN:your-domain.auth0.com}
auth0.clientId=${AUTH0_CLIENT_ID:your-client-id}
auth0.clientSecret=${AUTH0_CLIENT_SECRET:your-client-secret}
auth0.audience=${AUTH0_AUDIENCE:your-api-audience}
auth0.connection=${AUTH0_CONNECTION:Username-Password-Authentication}

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console - Disabled in production
spring.h2.console.enabled=false

# Logging
logging.level.com.example.auth0app=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
